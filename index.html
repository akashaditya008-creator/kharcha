<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)"><link rel="manifest" href="manifest.webmanifest"><style>[hidden]{display:none!important}</style><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Adi &amp; Choti Kharcha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: one-screen pocket ledger — sticky header, period strip, ring-of-icons chart or category ledger, two thumb buttons pinned at the bottom. */
:root{
  --bg:#F4F7F6; --surface:#FFFFFF; --ink:#13201F; --muted:#5E716E; --line:#DCE5E2;
  --head:#0F3D3A; --head-ink:#EAF4F1; --head-muted:#9FC2BB;
  --accent:#F2A33A; --spend:#D9494E; --spend-soft:#FBE3E2; --ok:#2E8B6E;
  --chip:#E9F0EE; --scrim:rgba(10,24,22,.42);
  --display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1514; --surface:#151F1E; --ink:#E6EFEC; --muted:#93A8A4; --line:#25312F;
  --head:#0A2826; --head-ink:#E6F2EE; --head-muted:#86AAA2;
  --accent:#F5B158; --spend:#F07479; --spend-soft:#3A1E20; --ok:#5CC09E;
  --chip:#1D2928; --scrim:rgba(0,0,0,.55); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1514; --surface:#151F1E; --ink:#E6EFEC; --muted:#93A8A4; --line:#25312F;
  --head:#0A2826; --head-ink:#E6F2EE; --head-muted:#86AAA2;
  --accent:#F5B158; --spend:#F07479; --spend-soft:#3A1E20; --ok:#5CC09E;
  --chip:#1D2928; --scrim:rgba(0,0,0,.55); color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);color:var(--head-ink);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:8px;
  display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:4px}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.ib:hover{background:rgba(255,255,255,.08)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand{min-width:0}
.brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.2px;line-height:1.1}
.brand p{margin:2px 0 0;font-size:12px;color:var(--head-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex}
.period{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-block:10px 2px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.period button{font-size:13px;color:var(--muted);padding:6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.period button:disabled{opacity:.3;cursor:default}
.period .prev{text-align:left}.period .next{text-align:right}
.period .cur{font-family:var(--display);font-weight:700;font-size:16px;color:var(--ink);letter-spacing:.2px}
.sync{font-size:11.5px;color:var(--muted);text-align:center;padding:0 16px;min-height:16px}
.sync .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.sync.live .dot{background:var(--ok)} .sync.warn .dot{background:var(--accent)}
main{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.stage{touch-action:pan-y;user-select:none}
.stage svg{display:block;width:100%;max-width:440px;height:auto;margin:0 auto}
.slot{cursor:pointer}
.slot .hit{fill:transparent}
.slot:focus-visible .hit{stroke:var(--accent);stroke-width:2}
.ctr-l{font:600 10px var(--body);letter-spacing:1.6px;fill:var(--muted)}
.ctr-v{font-family:var(--display);font-weight:700;fill:var(--spend)}
.ctr-s{font:500 11px var(--body);fill:var(--muted)}
.pct{font:600 12.5px var(--body)}
.pill-row{display:grid;grid-template-columns:56px 1fr 66px;align-items:center;gap:8px;margin-top:6px}
.lines{height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink);background:var(--surface);border:1px solid var(--line)}
.today{height:44px;display:grid;align-content:center;justify-items:center;gap:1px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--ink);line-height:1.1}
.today small{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}.today b{font:600 14px var(--display)}
.tx{cursor:pointer}.tx:active{background:var(--chip)}
.esheet{position:fixed;inset:0;z-index:35;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.esheet .box{width:min(520px,100%);background:var(--bg);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.esheet .t{font:600 17px var(--display)}.esheet .s{color:var(--muted);font-size:13.5px}
.esheet .go{padding:13px;border:0;border-radius:10px;background:var(--head);color:var(--head-ink);font:600 16px var(--body)}
.esheet .x{padding:12px;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:500 15px var(--body)}
.card.sel{outline:2px solid var(--cc);outline-offset:-2px}
.lines svg{width:34px;height:20px;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.lines[aria-pressed="true"]{background:var(--head);color:var(--head-ink);border-color:var(--head)}
.pill{background:var(--spend);color:#fff;border-radius:10px;padding:12px 14px;text-align:center;font-family:var(--display);font-size:19px;font-weight:600;
  box-shadow:0 2px 0 color-mix(in srgb,var(--spend) 60%,black)}
.pill small{font-family:var(--body);font-weight:500;font-size:13px;opacity:.9;margin-right:6px}
.ledger{margin-top:14px;display:grid;gap:2px}
.splits{display:grid;gap:10px;margin:14px 0 6px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.split .lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:5px;gap:8px}
.split .lab b{color:var(--ink);font-weight:600}
.bar{height:8px;border-radius:5px;background:var(--chip);display:flex;overflow:hidden}
.bar i{display:block;height:100%}
.cat{border-bottom:1px solid var(--line)}
.cat>button{width:100%;display:grid;grid-template-columns:18px 40px 1fr auto;align-items:center;gap:8px;padding:12px 2px;text-align:left}
.chev{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2;transition:transform .2s}
.cat[aria-expanded="true"] .chev{transform:rotate(180deg)}
.cic{width:36px;height:36px;display:grid;place-items:center}
.cic svg{width:30px;height:30px;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cname{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600;font-size:15.5px}
.cname span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{background:var(--ok);color:#fff;font-size:11.5px;font-weight:600;border-radius:9px;padding:1px 7px;flex:none}
.amt{color:var(--spend);font-weight:600}
.amt sup{font-size:.62em;vertical-align:top;margin-left:1px;opacity:.75}
.txs{display:grid;padding:0 0 10px 58px}
.tx{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px dashed var(--line);font-size:13.5px}
.tx:first-child{border-top:0}
.tx .n{min-width:0;overflow-wrap:anywhere}
.tx .m{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;color:var(--muted);font-size:12px}
.chip{background:var(--chip);border-radius:6px;padding:1px 6px}
.chip.w{color:var(--accent)} .chip.nd{color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:28px 8px;font-size:14px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:4;pointer-events:none;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock .in{max-width:488px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end}
.fab{pointer-events:auto;display:grid;justify-items:center;gap:4px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600}
.fab .c{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:5px solid var(--spend);box-shadow:0 6px 18px rgba(0,0,0,.12)}
.fab .c svg{width:34px;height:34px;stroke:var(--spend);stroke-width:4;stroke-linecap:round;fill:none}
.fab.sy .c{border-color:var(--ok)} .fab.sy .c svg{stroke:var(--ok);stroke-width:2.4}
.fab.sy.spin .c svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);z-index:21;background:var(--bg);overflow:auto;
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;
  display:grid;gap:14px;align-content:start;box-shadow:4px 0 24px rgba(0,0,0,.18)}
.drawer h2{margin:0;font-family:var(--display);font-size:18px}
.drawer label.k{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:600;display:block;margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;background:var(--surface)}
.seg button[aria-pressed="true"]{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface));font-weight:600}
.periods{display:grid;gap:8px}
.periods button{border:1.5px solid var(--line);border-radius:10px;padding:11px;font-size:15px;background:var(--surface)}
.periods button[aria-pressed="true"]{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface));font-weight:600}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dates input,.drawer input[type=date]{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:10px;padding:9px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px}
.sheet{position:fixed;inset:0;z-index:22;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet .bar2{display:flex;gap:8px;align-items:center;padding-block:10px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.sheet input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;background:var(--surface);color:var(--ink)}
.sheet .res{overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .sum{font-size:12.5px;color:var(--muted);padding:10px 0}
.res .tx{grid-template-columns:auto 1fr auto;align-items:start}
.res .tx .ic{width:26px;height:26px}
.res .tx .ic svg{width:24px;height:24px;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.res .tx .m{grid-column:2/-1}
.add{position:fixed;inset:0;z-index:23;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.add .hd{display:flex;align-items:center;gap:6px;background:var(--head);color:var(--head-ink);padding-block:8px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.add .hd h2{margin:0;font:600 18px var(--display)}
.abody{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;max-width:520px;width:100%;margin:0 auto;box-sizing:border-box;
  padding-block:14px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.adate{position:relative;align-self:center;display:flex;align-items:center;gap:8px;font:500 17px var(--body);padding:6px 10px;border-radius:10px;cursor:pointer}
.adate svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round}
.adate input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0}
.apanel{display:grid;grid-template-columns:72px 1fr 52px;align-items:stretch;background:var(--head);color:var(--head-ink);border-radius:12px;min-height:96px;box-shadow:0 2px 0 color-mix(in srgb,var(--head) 70%,black)}
.who{display:grid;align-content:center;justify-items:start;gap:2px;padding:0 10px;border-right:1px solid color-mix(in srgb,var(--head-ink) 30%,transparent);text-align:left;color:var(--head-ink)}
.who small{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--head-muted)}
.who b{font:600 15px var(--display)}
.aval{display:grid;place-items:center;font:500 46px var(--display);letter-spacing:.5px;overflow:hidden;white-space:nowrap;padding:0 6px}
.aval.long{font-size:28px}
.bk{display:grid;place-items:center;color:var(--head-ink)}
.bk svg{width:30px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.anote{display:flex;align-items:center;gap:8px;border-bottom:1.5px solid var(--line);padding:4px 2px}
.anote svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:1.5;stroke-linejoin:round;flex:none}
.anote input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:8px 0;outline:none}
.achips{display:flex;flex-wrap:wrap;gap:8px 14px}
.seg.sm button{padding:6px 10px;font-size:13px;border-radius:8px}
.add .err{color:var(--spend);font-size:13.5px;min-height:0}
.add .err:empty{display:none}
.pad{margin-top:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pad button{height:min(9.5vh,72px);min-height:52px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);font:400 30px var(--body);color:var(--ink)}
.pad button.op{font-size:28px;color:var(--muted)}
.pad button:active{background:var(--chip)}
.pad .choose{grid-column:1/-1;font:600 15px var(--body);letter-spacing:1.2px;text-transform:uppercase;color:var(--ink)}
.cgrid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-content:start;margin:0 -2px;padding:2px}
.cgrid.two{grid-template-columns:1fr 1fr}
.card{display:grid;justify-items:center;align-content:center;gap:6px;min-height:104px;padding:10px 4px;border-radius:6px;background:var(--surface);
  border:1px solid var(--line);border-bottom:3px solid color-mix(in srgb,var(--cc) 55%,var(--line));font-size:13.5px;color:var(--cc);text-align:center;line-height:1.2}
.card svg{width:44px;height:44px;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.card span{color:color-mix(in srgb,var(--cc) 70%,var(--ink));font-weight:500}
.card:active{background:color-mix(in srgb,var(--cc) 10%,var(--surface))}
.card.busy{opacity:.55;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){ .stage svg.in{animation:fi .28s ease-out} @keyframes fi{from{opacity:.25;transform:translateX(var(--dx,0))}to{opacity:1;transform:none}} }
.gate{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;padding:24px}
.gate form{display:grid;gap:12px;width:min(340px,100%)}.gate h2{margin:0;font:600 22px var(--display)}.gate p{margin:0;color:var(--muted)}
.gate input{font:inherit;font-size:18px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.gate button{font:600 16px var(--body);padding:12px;border:0;border-radius:10px;background:var(--head);color:var(--head-ink)}.gate .err{color:var(--spend);font-size:13.5px}

/* ===== iOS-style refresh: system type, grouped surfaces, frosted bars, gentle motion ===== */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --ink:#1C1C1E; --muted:#86868B; --line:rgba(60,60,67,.14);
  --tint:#0B7A6C; --head:#0B7A6C; --head-ink:#FFFFFF; --head-muted:rgba(255,255,255,.75);
  --accent:#F29A0E; --spend:#E5484D; --spend-soft:#FDE8E8; --ok:#2E9E66;
  --chip:rgba(118,118,128,.12); --scrim:rgba(0,0,0,.28); --bar:rgba(242,242,247,.78); --press:rgba(0,0,0,.05);
  --display:-apple-system,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  --body:-apple-system,"SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --ink:#F2F2F7; --muted:#98989F; --line:rgba(84,84,88,.5);
  --tint:#3CCFB8; --head:#3CCFB8; --head-ink:#04211D; --head-muted:rgba(4,33,29,.7);
  --accent:#FFB340; --spend:#FF6B6E; --spend-soft:#3A1C1D; --ok:#45D483;
  --chip:rgba(118,118,128,.24); --scrim:rgba(0,0,0,.5); --bar:rgba(12,12,14,.78); --press:rgba(255,255,255,.07); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --ink:#F2F2F7; --muted:#98989F; --line:rgba(84,84,88,.5);
  --tint:#3CCFB8; --head:#3CCFB8; --head-ink:#04211D; --head-muted:rgba(4,33,29,.7);
  --accent:#FFB340; --spend:#FF6B6E; --spend-soft:#3A1C1D; --ok:#45D483;
  --chip:rgba(118,118,128,.24); --scrim:rgba(0,0,0,.5); --bar:rgba(12,12,14,.78); --press:rgba(255,255,255,.07); color-scheme:dark }
html{overscroll-behavior-y:contain}
html,body{margin:0}
.cname span:first-child{color:var(--ink)!important}
.cat .amt,.tx .amt{color:var(--ink)}
.tx .amt{font-weight:500}
body{font-size:15px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
.frost{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
body::before{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
header.top{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:var(--ink);
  border-bottom:.5px solid transparent;transition:border-color .25s ease;padding-block:6px}
body.scrolled header.top{border-bottom-color:var(--line)}
.ib{color:var(--tint);border-radius:50%;transition:background .2s,transform .15s}
.ib:hover{background:var(--chip)} .ib:active{transform:scale(.92)}
.ib.spin svg{animation:sp .9s linear infinite}

window.google={script:{run:(function(){
  function mk(ok,bad){return new Proxy({},{get(_,name){
    if(name==="withSuccessHandler") return f=>mk(f,bad);
    if(name==="withFailureHandler") return f=>mk(ok,f);
    return (...a)=>{
      const done=r=>{ if(r&&r.ok) ok&&ok(r.d); else bad&&bad(new Error((r&&r.m)||"Couldn't reach the sheet.")); };
      const fail=()=>bad&&bad(new Error("Couldn't reach Google just now. Check your internet and tap Sync."));
      if(name==="getData") fetch(API+"?action=get&pass="+encodeURIComponent(a[0]||"")).then(r=>r.json()).then(done,fail);
      else if(name==="updateExpense") fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"edit",e:a[0],pass:a[1]})}).then(r=>r.json()).then(done,fail);
      else if(name==="addExpense") fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"add",e:a[0],pass:a[1]})}).then(r=>r.json()).then(done,fail);

function parseCSV(t){ const out=[];let row=[],f="",q=false;

    if(q){ if(ch==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=ch; }
    else if(ch==='"') q=true; else if(ch===','){row.push(f);f="";}
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&t[i+1]==='\n') i++; row.push(f);f=""; out.push(row); row=[]; }
    else f+=ch; }
  if(f!==""||row.length){row.push(f);out.push(row);} return out; }

  const out=[]; for(const r of rows.slice(1)){ const d=dmy(r[iD]); const a=parseFloat(String(r[iA]||"").replace(/[^\d.\-]/g,"")); if(!d||!isFinite(a)) continue;
    const ts=dmy(r[iT]); out.push([d.iso,a,(r[iP]||"").trim(),(r[iC]||"").trim(),(r[iN]||"").trim(),(r[iNo]||"").trim(),(r[iF]||"").trim(),(r[iS]||"").trim(), ts?ts.iso+"T"+ts.t:""]); }

  if(mode==="month") return [new Date(a.getFullYear(),a.getMonth(),1),new Date(a.getFullYear(),a.getMonth()+1,1)];
  if(mode==="year") return [new Date(a.getFullYear(),0,1),new Date(a.getFullYear()+1,0,1)];
  if(mode==="interval"){const f=S.from||addD(today(),-29), t=S.to||today(); return [f,addD(t,1)];}
  return [null,null];
}
function shift(mode,a,dir){

  if(mode==="month") return new Date(a.getFullYear(),a.getMonth()+dir,1);

}
function label(mode,a,short){

  if(mode==="week"){const l=addD(e,-1); return `${s.getDate()} ${MON[s.getMonth()]} – ${l.getDate()} ${MON[l.getMonth()]}`;}
  if(mode==="month") return short?`${MON[a.getMonth()]} ${String(a.getFullYear()).slice(2)}`:`${MONL[a.getMonth()]} ${a.getFullYear()}`;
  if(mode==="year") return String(a.getFullYear());
  if(mode==="interval"){const l=addD(e,-1); return `${s.getDate()} ${MON[s.getMonth()]} – ${l.getDate()} ${MON[l.getMonth()]} ${l.getFullYear()}`;}
  return "All time";
}
function shiftInterval(dir){ const [s,e]=range("interval"); const span=Math.round((e-s)/864e5); S.from=addD(s,span*dir); S.to=addD(e,span*dir-1); }

/* ---------- filtering ---------- */

/* ---------- chart ---------- */
const CX=180,CY=200,RO=94,RI=64,RM=(RO+RI)/2;
const SLOTS=[[40,62,'t'],[133,62,'t'],[227,62,'t'],[320,62,'t'],
  [34,140,'s'],[34,205,'s'],[34,270,'s'],[326,140,'s'],[326,205,'s'],[326,270,'s'],
  [40,346,'b'],[133,346,'b'],[227,346,'b'],[320,346,'b']]
  .map(([x,y,k])=>({x,y,k,ang:(Math.atan2(x-CX,-(y-CY))*180/Math.PI+360)%360})).sort((a,b)=>a.ang-b.ang);
const pt=(r,deg)=>{const t=(deg-90)*Math.PI/180;return [CX+r*Math.cos(t),CY+r*Math.sin(t)];};
function arc(a0,a1){ const [x0,y0]=pt(RM,a0),[x1,y1]=pt(RM,a1); return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${RM} ${RM} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; }
function groups(rows){
  const m=new Map(); for(const r of rows){const g=m.get(r.c)||{c:r.c,sum:0,n:0,rows:[]}; g.sum+=r.a; g.n++; g.rows.push(r); m.set(r.c,g);}
  return [...m.values()].sort((a,b)=>b.sum-a.sum);
}
const cd=(a,b)=>{const d=((a-b)%360+360)%360;return Math.min(d,360-d);};
function attach(g,ang){ // nearest angle inside the segment to the slot's angle
  const pad=Math.min(4,(g.a1-g.a0)/2), lo=g.a0+pad, hi=g.a1-pad;
  let best=g.mid,bd=1e9; for(const k of [-360,0,360]){ const t=Math.max(lo,Math.min(hi,ang+k)); const d=Math.abs(t-(ang+k)); if(d<bd){bd=d;best=t;} } return best;
}
function assign(cats){ // order-preserving match of segments (clockwise) to slots (clockwise)
  const N=cats.length,M=SLOTS.length;
  const dp=Array.from({length:N+1},()=>Array(M+1).fill(Infinity)), ch=Array.from({length:N+1},()=>Array(M+1).fill(0));
  for(let j=0;j<=M;j++) dp[0][j]=0;
  for(let i=1;i<=N;i++) for(let j=i;j<=M;j++){
    const g=cats[i-1], s=SLOTS[j-1], d=cd(attach(g,s.ang),s.ang);
    const skip=dp[i][j-1], take=dp[i-1][j-1]+d*d+.05*cd(g.mid,s.ang);
    if(take<=skip){dp[i][j]=take;ch[i][j]=1;} else {dp[i][j]=skip;}
  }
  const res=Array(N); let i=N,j=M; while(i>0){ if(ch[i][j]){res[i-1]=SLOTS[j-1];i--;j--;} else j--; } return {res,cost:dp[N][M]};
}
function layout(gs,total){ // try a few segment orders and ring start angles; keep the tidiest lines
  const desc=[...gs], inter=[]; { let l=0,r=desc.length-1,t=true; while(l<=r){ inter.push(t?desc[l++]:desc[r--]); t=!t; } }
  let best=null;
  for(const ord of [desc,inter]) for(let st=0;st<360;st+=6){
    let a=st; const segs=ord.map(g=>{const s={...g,a0:a,a1:a+(total?g.sum/total*360:0)}; s.mid=(s.a0+s.a1)/2; a=s.a1; return s;});
    const segsN=segs.map(s=>({...s,mid:((s.mid%360)+360)%360})); // mids clockwise from top
    const rot=[...segsN].sort((x,y)=>x.mid-y.mid).map(s=>segs[segsN.indexOf(s)]);
    const {res,cost}=assign(rot.map(s=>({...s})));
    if(!best||cost<best.cost) best={cost,order:rot,sl:res};
  }

let lastDir=0;
function drawChart(rows){

    keep.push({c:"Others",sum:rest.reduce((s,g)=>s+g.sum,0),n:rest.reduce((s,g)=>s+g.n,0),rows:rest.flatMap(g=>g.rows),members:rest.map(g=>g.c)}); gs=keep; }

  if(gs.length===1) svg+=`<circle cx="${CX}" cy="${CY}" r="${RM}" fill="none" stroke="${catMeta(gs[0].c)[1]}" stroke-width="${RO-RI}" data-c="${esc(gs[0].c)}" class="segc" pathLength="1" transform="rotate(-90 ${CX} ${CY})"/>`;

  byAng.forEach((g,i)=>{ const s=sl[i]; const col=catMeta(g.c)[1];

function fmtDate(r){ return `${DOW[r.d.getDay()]} ${r.d.getDate()} ${MON[r.d.getMonth()]}${r.d.getFullYear()!==today().getFullYear()?" "+r.d.getFullYear():""}`; }

const byRecent=(a,b)=>(b.iso.localeCompare(a.iso))||(b.ts.localeCompare(a.ts));

const RM_=matchMedia('(prefers-reduced-motion: reduce)');
function countTo(el,v){ const from=el._v==null?v:el._v; el._v=v; cancelAnimationFrame(el._raf);

  document.getElementById('curBtn').textContent=label(S.mode,S.anchor);
  document.getElementById('subtitle').textContent=[S.paid==="All"?"Both":S.paid, S.forW==="All"?"For everyone":"For "+S.forW, S.nw==="All"?null:S.nw].filter(Boolean).join(" · ");
  countTo(document.getElementById('pillAmt'),rows.reduce((s,r)=>s+r.a,0));
  const list=S.view==="list";
  document.getElementById('stage').hidden=list; document.getElementById('ledger').hidden=!list;
  document.getElementById('listL').setAttribute('aria-pressed',String(list)); document.getElementById('viewRing').setAttribute('aria-pressed',String(!list));
  { const t=isoDay(today()); const v=filtered(false).filter(r=>r.iso===t).reduce((s,r)=>s+r.a,0); document.getElementById('todayAmt').textContent=inr(v); }
  if(list){ drawLedger(rows); const L=document.getElementById('ledger'); if(lastDir){ L.style.setProperty('--dx',(lastDir*-40)+'px'); L.classList.remove('in'); void L.offsetWidth; L.classList.add('in'); } lastDir=0; } else drawChart(rows);
}
function go(dir){ if(S.mode==="all") return; lastDir=dir; if(S.mode==="interval") shiftInterval(dir); else S.anchor=shift(S.mode,S.anchor,dir); S.open.clear(); render(); }
document.getElementById('prevBtn').onclick=()=>go(-1);
document.getElementById('nextBtn').onclick=()=>go(1);
document.getElementById('curBtn').onclick=()=>openDrawer();
document.getElementById('pill').onclick=()=>setView(S.view==="list"?"chart":"list");
document.getElementById('listL').onclick=()=>setView("list");
document.getElementById('viewRing').onclick=()=>setView("chart");
document.getElementById('todayBtn').onclick=()=>{ S.mode="day"; store.set("mode","day"); S.anchor=today(); S.open.clear(); setView("list"); };
document.addEventListener('keydown',e=>{ if(e.target.closest('input,.drawer,.sheet'))return; if(e.key==="ArrowLeft")go(-1); if(e.key==="ArrowRight")go(1); });
(()=>{ let x0=null,y0=0; const zone=document.querySelector('main');
  zone.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  zone.addEventListener('touchend',e=>{ if(x0==null)return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null; const row=e.target.closest&&e.target.closest('.txw'); if(row&&(dx<0||row.classList.contains('open')||Date.now()-swipedAt<400)) return;
    if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4) go(dx<0?1:-1); },{passive:true}); })();

/* ---------- drawer ---------- */
const scrim=document.getElementById('scrim'), drawer=document.getElementById('drawer');
function segs(id,opts,cur,on){ const el=document.getElementById(id); el.innerHTML=opts.map(o=>`<button aria-pressed="${o===cur}">${esc(o)}</button>`).join("");
  el.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{on(opts[i]); buildDrawer(); render();}); }
function buildDrawer(){
  segs('fPaid',["All","Aditya","Choti"],S.paid,v=>{S.paid=v;store.set("paid",v);});
  const fors=["All",...new Set(ROWS.map(r=>forBucket(r.f)))].sort((a,b)=>a==="All"?-1:b==="All"?1:a==="Unspecified"?1:b==="Unspecified"?-1:a.localeCompare(b));
  segs('fFor',fors,S.forW,v=>{S.forW=v;store.set("for",v);});
  segs('fNw',["All","Need","Want"],S.nw,v=>{S.nw=v;store.set("nw",v);});
  const modes=[["day","Day"],["week","Week"],["month","Month"],["year","Year"],["all","All"],["interval","Interval"]];
  const fp=document.getElementById('fPeriod'); fp.innerHTML=modes.map(([k,l])=>`<button aria-pressed="${S.mode===k}">${l}</button>`).join("");
  fp.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{ S.mode=modes[i][0]; store.set("mode",S.mode); if(S.mode!=="interval"){S.anchor=today(); closeDrawer();} buildDrawer(); render(); });
  document.getElementById('intervalBox').hidden=S.mode!=="interval";
  const [s,e]=range("interval"), iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  document.getElementById('ivFrom').value=iso(s); document.getElementById('ivTo').value=iso(addD(e,-1));
}
const fromISO=v=>{const [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d);};
document.getElementById('ivFrom').onchange=e=>{ if(e.target.value){S.from=fromISO(e.target.value); if(S.to&&S.to<S.from)S.to=S.from; render();} };
document.getElementById('ivTo').onchange=e=>{ if(e.target.value){S.to=fromISO(e.target.value); if(S.from&&S.from>S.to)S.from=S.to; render();} };
document.getElementById('pickDate').onchange=e=>{ if(!e.target.value)return; S.mode="day"; store.set("mode","day"); S.anchor=fromISO(e.target.value); buildDrawer(); render(); closeDrawer(); };
function openDrawer(){ buildDrawer(); scrim.hidden=false; drawer.hidden=false; drawer.querySelector('button').focus(); }
function closeDrawer(){ scrim.hidden=true; drawer.hidden=true; }
document.getElementById('menuBtn').onclick=openDrawer; scrim.onclick=closeDrawer;
document.addEventListener('keydown',e=>{ if(e.key==="Escape"){ closeDrawer(); closeSearch(); } });

/* ---------- search ---------- */
const sheet=document.getElementById('sheet'), q=document.getElementById('q'), res=document.getElementById('res');
function doSearch(){ const t=q.value.trim().toLowerCase();
  const rows=filtered(false).filter(r=>!t||r.n.toLowerCase().includes(t)||r.c.toLowerCase().includes(t)||(r.s||"").toLowerCase().includes(t)).sort(byRecent);
  const shown=rows.slice(0,300);
  res.innerHTML=`<div class="sum num">${rows.length.toLocaleString('en-IN')} matches · ${inr(rows.reduce((s,r)=>s+r.a,0))} · all dates${rows.length>300?" · showing latest 300":""}</div>`+(shown.map(r=>txHTML(r,true)).join("")||`<div class="empty">No entries match “${esc(q.value)}”.</div>`); }
document.getElementById('searchBtn').onclick=()=>{ sheet.hidden=false; doSearch(); q.focus(); };
function closeSearch(){ sheet.hidden=true; }
document.getElementById('closeSearch').onclick=closeSearch; q.oninput=doSearch;

/* ---------- live data from the sheet (Apps Script) ---------- */
const syncEl=document.getElementById('sync'), syncTxt=document.getElementById('syncTxt'), syncBtn=document.getElementById('syncBtn');
const fmtWhen=ms=>{const d=new Date(ms); return `${d.getDate()} ${MON[d.getMonth()]}, ${d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'})}`;};
function setSync(kind,txt){ syncEl.className="sync "+kind; syncTxt.textContent=txt; }
let USER="", loading=false, CACHE_AT=0;
{ const c=store.get("cache",null); if(c&&c.rows&&c.rows.length){ ROWS=toRows(c.rows); LOADING=false; CACHE_AT=c.at||0; } }
function applyData(d){
  LOADING=false; ROWS=toRows(d.rows||[]); USER=(d.user||"").toLowerCase();
  store.set("cache",{rows:d.rows||[],at:Date.now()});
  render(); if(!drawer.hidden) buildDrawer(); if(!sheet.hidden) doSearch();
  CACHE_AT=Date.now(); setSync("live",`Live · ${ROWS.length.toLocaleString('en-IN')} entries · synced ${fmtWhen(Date.now())}`);
}
const gate=document.getElementById('gate'), gIn=document.getElementById('gIn'), gErr=document.getElementById('gErr');
const PW=()=>store.get("pass","");
function askPass(msg){ gErr.textContent=msg||""; gate.hidden=false; setTimeout(()=>gIn.focus(),50); }
document.getElementById('gForm').addEventListener('submit',e=>{ e.preventDefault(); const v=gIn.value.trim(); if(!v) return; store.set("pass",v); gate.hidden=true; gIn.value=""; pull(); });
function errText(e){ const m=String(e&&e.message||e||"");
  if(/PASSCODE/.test(m)){ store.set("pass",""); askPass("Wrong passcode. Ask Aditya."); return "Passcode needed."; }
  if(/permission|access|not have|denied|authoriz/i.test(m)) return "This Google account can't open the expense sheet. Ask Aditya to share it with you.";
  return m || "Couldn't reach Google just now. Tap Sync to try again."; }
function pull(){ if(loading) return; if(!PW()){ askPass(); return; } loading=true; syncBtn.classList.add('spin'); if(!ROWS.length) setSync("","Loading your sheet…"); else setSync("",`Showing saved copy from ${fmtWhen(CACHE_AT)} · updating…`);
  google.script.run.withSuccessHandler(d=>{loading=false; syncBtn.classList.remove('spin'); applyData(d);})
    .withFailureHandler(e=>{loading=false; syncBtn.classList.remove('spin'); LOADING=false; render(); const m=errText(e); if(ROWS.length&&!/PASSCODE/.test(String(e&&e.message||e))) setSync("warn",`Offline copy · last synced ${fmtWhen(CACHE_AT)} · tap Sync`); else setSync("warn",m);}).getData(PW()); }
syncBtn.onclick=pull;
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==="visible") pull(); });

/* ---------- add expense: keypad → choose category → saved ---------- */
const add=document.getElementById('addSheet'), toast=document.getElementById('toast');
const A={expr:"",paid:"Aditya",nw:"Need",forW:"Shared",step:"pad",saving:false,edit:null};
const isoDay=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const aDate=document.getElementById('aDate'), aVal=document.getElementById('aVal'), aErr=document.getElementById('aErr');
function evalExpr(s){ // digits, ".", + − × ÷ with normal precedence; no eval()
  const toks=s.match(/\d*\.?\d+|\d+\.|[+\-×÷]/g)||[]; if(!toks.length) return 0;
  const out=[],ops=[],pr=o=>o==="×"||o==="÷"?2:1;
  const app=()=>{const o=ops.pop(),b=out.pop(),a=out.pop(); out.push(o==="+"?a+b:o==="-"?a-b:o==="×"?a*b:b===0?NaN:a/b);};
  let expectNum=true;
  for(const t of toks){ if(/[+\-×÷]/.test(t)){ if(expectNum) continue; while(ops.length&&pr(ops[ops.length-1])>=pr(t)) app(); ops.push(t); expectNum=true; }
    else { out.push(parseFloat(t)); expectNum=false; } }
  if(expectNum&&ops.length) ops.pop(); while(ops.length) app(); const v=out.pop(); return isFinite(v)?Math.round(v*100)/100:NaN;
}
function showVal(){ const e=A.expr; aVal.textContent=e===""?"0":e.replace(/-/g,"−"); aVal.classList.toggle('long',e.length>9); }
function key(k){
  if(A.step!=="pad") setStep("pad");
  const last=A.expr.slice(-1), isOp=c=>/[+\-×÷]/.test(c);
  if(k==="="){ const v=evalExpr(A.expr); A.expr=isNaN(v)?"":String(v); }
  else if(isOp(k)){ if(A.expr===""&&k!=="-") return; A.expr=isOp(last)?A.expr.slice(0,-1)+k:A.expr+k; }
  else if(k==="."){ const seg=A.expr.split(/[+\-×÷]/).pop(); if(seg.includes(".")) return; A.expr+=(seg===""?"0.":"."); }
  else { if(A.expr.length>16) return; A.expr+=k; }
  aErr.textContent=""; showVal();
}
function dateLabel(){ const d=fromISO(aDate.value||isoDay(today())); return `${["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()]}, ${d.getDate()} ${MONL[d.getMonth()]}${d.getFullYear()!==today().getFullYear()?" "+d.getFullYear():""}`; }
function chips(id,opts,k){ const el=document.getElementById(id); el.innerHTML=opts.map(o=>`<button type="button" aria-pressed="${A[k]===o}">${esc(o)}</button>`).join("");
  el.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{A[k]=opts[i]; chips(id,opts,k);}); }
function catOrder(){ const m=new Map(); ROWS.forEach(r=>m.set(r.c,(m.get(r.c)||0)+1)); Object.keys(CATS).filter(c=>c!=="Others").forEach(c=>{if(!m.has(c))m.set(c,0);});
  return [...m.keys()].sort((a,b)=>a.localeCompare(b)); }
function setStep(s){ A.step=s; document.getElementById('aPad').hidden=s!=="pad"; document.getElementById('aCats').hidden=s!=="cats"; document.getElementById('aSub').hidden=s!=="sub";
  if(s==="cats"){ const g=document.getElementById('aCats');
    g.innerHTML=catOrder().map(c=>{const col=catMeta(c)[1]; return `<button type="button" class="card" data-c="${esc(c)}" style="--cc:${col}"${A.edit&&A.edit.c===c?' data-sel="1"':''}>${icon(c,col)}<span>${esc(c)}</span></button>`;}).join("");
    g.querySelectorAll('[data-sel]').forEach(b=>b.classList.add('sel'));
    g.querySelectorAll('.card').forEach(b=>b.onclick=()=>{ if(b.dataset.c==="House") setStep("sub"); else save(b.dataset.c,"",b); });
    g.scrollTop=0; } }
document.querySelectorAll('#aSub .card').forEach(b=>b.onclick=()=>save("House",b.dataset.s,b));
function openAdd(){
  A.expr=""; A.paid=store.get("lastPaid",/jayswal|spardha/.test(USER)?"Choti":"Aditya"); A.nw="Need"; A.forW="Shared"; A.saving=false; A.edit=null; A.rid=Date.now().toString(36)+Math.random().toString(36).slice(2,10); document.getElementById('addTitle').textContent="New expense";
  aDate.value=isoDay(today()); document.getElementById('aDateTxt').textContent=dateLabel();
  document.getElementById('aNote').value=""; aErr.textContent=""; document.getElementById('aWho').textContent=A.paid;
  chips('aNw',["Need","Want"],"nw"); chips('aFor',["Shared","Aditya","Choti","Other"],"forW");
  showVal(); setStep("pad"); add.hidden=false;
}
function openEdit(r){
  openAdd(); A.edit=r; document.getElementById('addTitle').textContent="Edit expense";
  A.expr=String(r.a); A.paid=r.p==="Choti"?"Choti":"Aditya"; A.nw=r.nw==="Want"?"Want":"Need"; A.forW=r.f;
  aDate.value=r.iso; document.getElementById('aDateTxt').textContent=dateLabel(); document.getElementById('aNote').value=r.n||"";
  document.getElementById('aWho').textContent=A.paid; chips('aNw',["Need","Want"],"nw"); chips('aFor',["Shared","Aditya","Choti","Other"],"forW"); showVal();
}
function closeAdd(){ if(A.saving) return; add.hidden=true; }
document.getElementById('addBtn').onclick=openAdd;
document.getElementById('closeAdd').onclick=()=>{ if(A.step!=="pad") setStep(A.step==="sub"?"cats":"pad"); else closeAdd(); };
aDate.onchange=()=>{ if(!aDate.value) aDate.value=isoDay(today()); document.getElementById('aDateTxt').textContent=dateLabel(); };
document.getElementById('aWhoBtn').onclick=()=>{ A.paid=A.paid==="Aditya"?"Choti":"Aditya"; document.getElementById('aWho').textContent=A.paid; store.set("lastPaid",A.paid); };
document.getElementById('aBack').onclick=()=>{ A.expr=A.expr.slice(0,-1); showVal(); };
document.querySelectorAll('#aPad [data-k]').forEach(b=>b.onclick=()=>key(b.dataset.k));
document.getElementById('aChoose').onclick=()=>{ const v=evalExpr(A.expr); if(!(v>0)){ aErr.textContent="Enter the amount first."; return; } A.expr=String(v); showVal(); aErr.textContent=""; setStep("cats"); };
add.addEventListener('keydown',e=>{ if(e.target.id==="aNote"||add.hidden) return;
  const m={"*":"×","/":"÷","Enter":"="}; const k=m[e.key]||e.key; if(/^[\d.+\-×÷=]$/.test(k)){ e.preventDefault(); key(k);} else if(e.key==="Backspace"){ e.preventDefault(); A.expr=A.expr.slice(0,-1); showVal(); } });
function save(cat,sub,btn){
  if(A.saving) return; const amt=evalExpr(A.expr); if(!(amt>0)){ setStep("pad"); aErr.textContent="Enter the amount first."; return; }
  A.saving=true; btn.classList.add('busy'); aErr.textContent=""; const ed=A.edit;
  const payload={amount:amt,category:cat,houseSub:sub,paidBy:A.paid,needWant:A.nw,expenseFor:A.forW,date:aDate.value,note:document.getElementById('aNote').value.trim()};
  payload.rid=A.rid;
  if(ed){ payload.row=ed.rn; payload.ts=ed.ts; payload.oldAmt=ed.a; }
  google.script.run.withSuccessHandler(d=>{ A.saving=false; btn.classList.remove('busy'); add.hidden=true; applyData(d);
      toast.textContent=`${ed?"Updated":"Saved"} ${inr(amt)} · ${cat}${sub?" ("+sub.replace("House - ","")+")":""}`; toast.hidden=false; setTimeout(()=>toast.hidden=true,2600); })
    .withFailureHandler(x=>{ A.saving=false; btn.classList.remove('busy'); aErr.textContent=errText(x)+" Tap Sync to check whether it was saved before trying again."; })
    [ed?"updateExpense":"addExpense"](payload,PW());
}
document.addEventListener('keydown',e=>{ if(e.key==="Escape") closeAdd(); });

/* ---------- tap an entry → edit ---------- */
const eSheet=document.getElementById('eSheet'); let eRow=null;
function openEntry(rn){ const r=ROWS.find(x=>x.rn===rn); if(!r) return; eRow=r;
  document.getElementById('eT').textContent=`${r.n||r.c} · ${inr(r.a)}`;
  document.getElementById('eS').textContent=`${r.c}${r.s?" ("+r.s.replace("House - ","")+")":""} · ${fmtDate(r)} · Paid by ${r.p||"—"}`;
  eSheet.hidden=false; }
let swipedAt=0;
document.addEventListener('click',e=>{ if(Date.now()-swipedAt<400) return;
  const a=e.target.closest('.txa'); if(a){ const w=a.closest('.txw'); w.classList.remove('open'); const r=ROWS.find(x=>x.rn===+w.dataset.rn); if(r){ if(!sheet.hidden) closeSearch(); openEdit(r);} return; }
  const t=e.target.closest('.txw[data-rn]'); if(!t||e.target.closest('#addSheet,#eSheet')) return;
  if(t.classList.contains('open')){ t.classList.remove('open'); return; }
  if(+t.dataset.rn) openEntry(+t.dataset.rn); });
/* swipe an entry left to reveal Edit */
(()=>{ let w=null,x0=0,y0=0,dx=0,drag=false; const W=84;
  const closeOthers=t=>document.querySelectorAll('.txw.open').forEach(o=>{ if(o!==t) o.classList.remove('open'); });
  document.addEventListener('touchstart',e=>{ const t=e.target.closest('.txw'); closeOthers(t); w=t; drag=false; dx=0; if(t){ x0=e.touches[0].clientX; y0=e.touches[0].clientY; } },{passive:true});
  document.addEventListener('touchmove',e=>{ if(!w) return; const mx=e.touches[0].clientX-x0, my=e.touches[0].clientY-y0;
    if(!drag){ if(Math.abs(mx)>10&&Math.abs(mx)>Math.abs(my)*1.3) drag=true; else { if(Math.abs(my)>10) w=null; return; } }
    const base=w.classList.contains('open')?-W:0; dx=Math.max(-W-24,Math.min(0,base+mx));
    const tx=w.querySelector('.tx'); tx.style.transition='none'; tx.style.transform=`translateX(${dx}px)`; },{passive:true});
  document.addEventListener('touchend',()=>{ if(!w) return; if(drag){ const tx=w.querySelector('.tx'); tx.style.transition=''; tx.style.transform=''; w.classList.toggle('open',dx<-W/2); swipedAt=Date.now(); } w=null; },{passive:true});
})();
/* pull down at the top to sync */
(()=>{ const ptr=document.getElementById('ptr'); let y0=null,dy=0;
  addEventListener('touchstart',e=>{ y0=(scrollY<=0&&!e.target.closest('.add,.sheet,.drawer,.esheet,.gate,.txw'))?e.touches[0].clientY:null; dy=0; },{passive:true});
  addEventListener('touchmove',e=>{ if(y0==null) return; dy=Math.max(0,e.touches[0].clientY-y0); ptr.style.setProperty('--p',Math.min(1,dy/90).toFixed(3)); },{passive:true});
  addEventListener('touchend',()=>{ if(y0==null) return; if(dy>90) pull(); y0=null; dy=0; ptr.style.setProperty('--p',0); },{passive:true});
})();
addEventListener('scroll',()=>document.body.classList.toggle('scrolled',scrollY>8),{passive:true});
document.getElementById('eClose').onclick=()=>{eSheet.hidden=true;};
eSheet.addEventListener('click',e=>{ if(e.target===eSheet) eSheet.hidden=true; });
document.getElementById('eEdit').onclick=()=>{ eSheet.hidden=true; if(!sheet.hidden) closeSearch(); openEdit(eRow); };

render(); pull();
})();
</script>
